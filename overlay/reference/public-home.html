<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Public home mockup</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-pill: 999px;
  }
  .theme-light {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f2f5; --surface-3: #e6e9ee;
    --border: #e1e4e8; --text: #1a1d21; --text-muted: #565e68; --text-faint: #8a919b;
    --accent: #2563eb; --accent-hover: #1d4fd8; --accent-weak: #e7eefc; --accent-text: #ffffff;
    --danger: #d92d20; --warn: #b26a00; --ok: #16a34a;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.08);
    --glass: rgba(255,255,255,.72);
    --glow: radial-gradient(1200px 400px at 10% -10%, rgba(37,99,235,.10), transparent 60%),
            radial-gradient(800px 300px at 95% 0%, rgba(22,163,74,.08), transparent 60%);
    color-scheme: light;
  }
  .theme-dark {
    --bg: #0e1013; --surface: #16191d; --surface-2: #1d2126; --surface-3: #262b31;
    --border: #2a2f36; --text: #e7e9ec; --text-muted: #a5adb7; --text-faint: #6e7681;
    --accent: #6b9bff; --accent-hover: #86afff; --accent-weak: #1b2741; --accent-text: #0e1013;
    --danger: #f2615a; --warn: #f0b34a; --ok: #3ccf6e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.35);
    --glass: rgba(22,25,29,.72);
    --glow: radial-gradient(1200px 400px at 10% -10%, rgba(107,155,255,.14), transparent 60%),
            radial-gradient(800px 300px at 95% 0%, rgba(60,207,110,.08), transparent 60%);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: #8a919b; padding: 16px; }
  .intro { color: #fff; font-size: 14px; margin: 0 0 12px; max-width: 1200px; }
  .intro b { font-weight: 600; }
  .panes { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 1500px) { .panes { grid-template-columns: 1fr 1fr; } }
  .pane-label { font: 600 11px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: #fff; margin: 0 0 6px; }

  .app { background: var(--bg); background-image: var(--glow); color: var(--text); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.25); min-height: 760px; }

  /* header */
  .hdr { position: sticky; top: 0; display: flex; align-items: center; gap: 20px; padding: 10px 20px; background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff; font: 700 13px var(--font-mono); box-shadow: 0 2px 8px rgba(37,99,235,.35); }
  .brand-name { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
  .brand-sub { font: 12px var(--font-mono); color: var(--text-muted); }
  nav.primary { display: flex; gap: 2px; margin-left: 8px; }
  nav.primary a { font-size: 13.5px; color: var(--text-muted); text-decoration: none; padding: 7px 11px; border-radius: var(--radius-pill); }
  nav.primary a:hover { background: var(--surface-2); color: var(--text); }
  nav.primary a[aria-current] { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
  .util { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .iconbtn { width: 34px; height: 34px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); display: grid; place-items: center; cursor: pointer; }
  .btn { height: 34px; padding: 0 14px; border-radius: var(--radius-pill); font: 600 13px var(--font-sans); border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px rgba(255,255,255,.06) inset; }
  .btn svg, .iconbtn svg { width: 16px; height: 16px; }

  main { padding: 22px 20px 28px; max-width: 1180px; margin: 0 auto; }

  /* hero status */
  .hero { display: flex; align-items: center; gap: 16px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
  .pulse { position: relative; width: 14px; height: 14px; flex: none; }
  .pulse::before, .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--ok); }
  .pulse::after { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; opacity: .55; }
  @keyframes ping { 75%, 100% { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }
  .hero h1 { margin: 0; font-size: 19px; letter-spacing: -.015em; font-weight: 650; }
  .hero p { margin: 3px 0 0; color: var(--text-muted); font-size: 13.5px; }
  .hero .facts { margin-left: auto; display: flex; gap: 22px; }
  .fact { text-align: right; }
  .fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
  .fact .v { font: 600 14px var(--font-mono); margin-top: 2px; }

  /* bento */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; margin-top: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 650; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .card h2 .more { margin-left: auto; font-weight: 500; color: var(--accent); font-size: 12.5px; text-decoration: none; }
  .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-6 { grid-column: span 6; } .span-12 { grid-column: span 12; }
  @media (max-width: 900px) { .span-8, .span-4, .span-6 { grid-column: span 12; } .hero { flex-wrap: wrap; } .hero .facts { margin-left: 0; } nav.primary { display: none; } }

  /* port rows */
  .port { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 12px; align-items: center; padding: 11px 4px; border-top: 1px solid var(--border); }
  .port:first-of-type { border-top: 0; }
  .ptag { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 700 12px var(--font-mono); background: var(--surface-2); color: var(--text-muted); }
  .pname { font-weight: 600; font-size: 14px; }
  .pmeta { font: 12px var(--font-mono); color: var(--text-muted); margin-top: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--radius-pill); font: 600 12px var(--font-sans); background: var(--surface-2); color: var(--text-muted); white-space: nowrap; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.ok { color: var(--ok); background: color-mix(in oklab, var(--ok) 13%, transparent); }
  .chip.idle { color: var(--text-muted); }
  .spark { width: 110px; height: 28px; }
  .spark path { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  .spark .area { fill: color-mix(in oklab, var(--accent) 16%, transparent); stroke: none; }

  /* heard list */
  .heard { list-style: none; margin: 0; padding: 0; }
  .heard li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  .heard li:first-child { border-top: 0; }
  .call { font: 600 13px var(--font-mono); padding: 3px 8px; border-radius: var(--radius); background: var(--accent-weak); color: var(--accent); }
  .via { color: var(--text-muted); font-size: 12.5px; }
  .ago { margin-left: auto; color: var(--text-faint); font: 12px var(--font-mono); }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 22px 8px; color: var(--text-muted); font-size: 13.5px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius-md); }
  .empty .big { font-size: 22px; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--surface-2); border-radius: var(--radius-md); padding: 12px; }
  .stat .k { font-size: 11.5px; color: var(--text-muted); }
  .stat .v { font: 650 20px var(--font-mono); margin-top: 4px; letter-spacing: -.02em; }
  .stat .v small { font-size: 12px; color: var(--text-faint); font-weight: 500; }

  .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .app-tile { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); }
  .app-tile .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-weak); color: var(--accent); flex: none; }
  .app-tile .ico svg { width: 16px; height: 16px; }
  .app-tile b { font-size: 13.5px; display: block; }
  .app-tile span { font-size: 12.5px; color: var(--text-muted); }
  .lock { margin-left: auto; color: var(--text-faint); }
  .lock svg { width: 14px; height: 14px; }

  footer { margin-top: 18px; display: flex; gap: 14px; color: var(--text-faint); font: 12px var(--font-mono); }
  footer span + span::before { content: "·"; margin-right: 14px; }
  .sample { display: inline-block; margin-left: 8px; font: 600 10.5px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); }
</style>
</head>
<body>
<p class="intro"><b>Public home page</b>, what anyone on the network sees before signing in. Read-only views from today's node menu, with <b>Webmail</b> and <b>SysOp sign in</b> top right. Same page in both themes; the real one follows the system setting. Numbers are sample data.</p>
<div class="panes">
  <div><p class="pane-label">Light</p><div class="app theme-light" id="tpl"></div></div>
  <div><p class="pane-label">Dark</p><div class="app theme-dark" id="dark"></div></div>
</div>

<template id="page">
  <header class="hdr">
    <div class="brand">
      <div class="logo">EG</div>
      <div><div class="brand-name">AD6DM-11</div><div class="brand-sub">EGNOD · CM98hj</div></div>
    </div>
    <nav class="primary" aria-label="Main navigation">
      <a href="#" aria-current="page">Overview</a>
      <a href="#">Ports</a>
      <a href="#">Heard</a>
      <a href="#">Links &amp; routes</a>
      <a href="#">Sessions</a>
    </nav>
    <div class="util">
      <button class="iconbtn" title="Switch to the other theme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Webmail
      </button>
      <button class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        SysOp sign in
      </button>
    </div>
  </header>

  <main>
    <section class="hero" aria-label="Node status">
      <span class="pulse" aria-hidden="true"></span>
      <div>
        <h1>Gateway on the air</h1>
        <p>Winlink RMS <b>AD6DM-10</b> on 145.630 MHz · VARA FM and 1200 baud packet</p>
      </div>
      <div class="facts">
        <div class="fact"><div class="k">Uptime</div><div class="v">2d 04:17</div></div>
        <div class="fact"><div class="k">CMS</div><div class="v" style="color:var(--ok)">reachable</div></div>
        <div class="fact"><div class="k">Version</div><div class="v">6.0.26.1</div></div>
      </div>
    </section>

    <div class="grid">
      <section class="card span-8">
        <h2>Radio ports <a class="more" href="#">All ports →</a></h2>
        <div class="port">
          <div class="ptag">3</div>
          <div><div class="pname">VARA FM</div><div class="pmeta">145.630 MHz · VARAFM96 · TNC 127.0.0.1:8300</div></div>
          <svg class="spark" viewBox="0 0 110 28" aria-label="Frames per hour, last 24 hours"><path class="area" d="M0 28 L0 22 L14 20 L28 24 L42 16 L56 18 L70 9 L84 14 L98 11 L110 13 L110 28 Z"/><path d="M0 22 L14 20 L28 24 L42 16 L56 18 L70 9 L84 14 L98 11 L110 13"/></svg>
          <span class="chip ok"><span class="dot"></span>Listening</span>
        </div>
        <div class="port">
          <div class="ptag">2</div>
          <div><div class="pname">Packet 1200</div><div class="pmeta">145.630 MHz · Dire Wolf KISS :8001 · TXTAIL 100 ms</div></div>
          <svg class="spark" viewBox="0 0 110 28" aria-label="Frames per hour, last 24 hours"><path class="area" d="M0 28 L0 18 L14 15 L28 19 L42 8 L56 12 L70 14 L84 6 L98 10 L110 7 L110 28 Z"/><path d="M0 18 L14 15 L28 19 L42 8 L56 12 L70 14 L84 6 L98 10 L110 7"/></svg>
          <span class="chip ok"><span class="dot"></span>Listening</span>
        </div>
        <div class="port">
          <div class="ptag">1</div>
          <div><div class="pname">Internet</div><div class="pmeta">Telnet :8010 · CMS link · store and forward on standby</div></div>
          <span></span>
          <span class="chip idle"><span class="dot"></span>No sessions</span>
        </div>
      </section>

      <section class="card span-4">
        <h2>Recently heard <span class="sample">sample</span><a class="more" href="#">All →</a></h2>
        <ul class="heard">
          <li><span class="call">W6SAR-10</span><span class="via">Packet · beacon</span><span class="ago">4m</span></li>
          <li><span class="call">N6UG</span><span class="via">Packet · via W6SAR-10</span><span class="ago">17m</span></li>
          <li><span class="call">KN6HTD-10</span><span class="via">Packet</span><span class="ago">1h</span></li>
          <li><span class="call">AD6DM</span><span class="via">VARA FM</span><span class="ago">3h</span></li>
        </ul>
      </section>

      <section class="card span-6">
        <h2>Who's connected</h2>
        <div class="empty"><span class="big">📡</span>Nobody is connected right now.<br><span style="color:var(--text-faint)">Sessions show here live as stations connect.</span></div>
      </section>

      <section class="card span-6">
        <h2>Today <span class="sample">sample</span></h2>
        <div class="stat-row">
          <div class="stat"><div class="k">Winlink sessions</div><div class="v">3</div></div>
          <div class="stat"><div class="k">Messages</div><div class="v">7</div></div>
          <div class="stat"><div class="k">Frames heard</div><div class="v">412</div></div>
          <div class="stat"><div class="k">Held mail</div><div class="v">0 <small>BBS</small></div></div>
        </div>
      </section>

      <section class="card span-12">
        <h2>On this node</h2>
        <div class="apps">
          <div class="app-tile"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5.2L4 17.2z"/></svg></div><div><b>Winlink RMS · AD6DM-10</b><span>Connect from Winlink Express or Pat on 145.630 MHz</span></div></div>
          <div class="app-tile"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div><div><b>Webmail</b><span>Read and send BBS mail in the browser</span></div><span class="lock" title="Sign-in required"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span></div>
        </div>
      </section>
    </div>

    <footer><span>LinBPQ 6.0.26.1</span><span>G8BPQ, GPLv3</span><span>Updated 08:31</span></footer>
  </main>
</template>

<script>
  const t = document.getElementById('page').content;
  document.getElementById('tpl').appendChild(t.cloneNode(true));
  document.getElementById('dark').appendChild(t.cloneNode(true));
</script>
</body>
</html>
